    .login-title { font-size: 20px; font-weight: 700; margin-bottom: 5px; }
    .login-sub { font-size: 13px; color: var(--mu); margin-bottom: 4px; }
    .login-dev { font-size: 12px; color: var(--g); font-weight: 500; margin-bottom: 1.5rem; }
    .g-btn { width: 100%; padding: 11px; border-radius: 9px; border: 1px solid var(--bd); background: #fff; font-size: 13.5px; font-weight: 500; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer; transition: background .12s; }
    .g-btn:hover { background: var(--bg); }
    .g-btn:disabled { opacity: .5; cursor: default; }
    .login-note { font-size: 11px; color: var(--mu); margin-top: 14px; line-height: 1.7; }
    .form-label { display: block; font-size: 12px; font-weight: 500; color: var(--mu); margin-bottom: 5px; text-align: left; }
    .form-input { width: 100%; padding: 10px 12px; border: 1px solid var(--bd); border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; transition: border-color .15s; }

    .code-tier-0 { background: #F1F3F1; color: #6B7B72; }
    .code-tier-1 { background: var(--al); color: var(--am); }
    .code-tier-2 { background: var(--gl); color: var(--g); }

    /* HERO */
    .hero { background: #fff; padding: 3rem 1.5rem 2.5rem; text-align: center; border-bottom: 1px solid var(--bd); }
    .hero-in { max-width: 680px; margin: 0 auto; }
    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--g); background: var(--gl); padding: 4px 14px; border-radius: 99px; margin-bottom: 1.25rem; }
    .hero-title { font-size: clamp(28px, 6vw, 40px); font-weight: 700; letter-spacing: -.03em; margin-bottom: 8px; }
    .hero-title em { color: var(--g); font-style: normal; }

    .stats { display: flex; justify-content: center; gap: 2.5rem; margin-bottom: 1.75rem; }

    .tier-badge { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 99px; flex-shrink: 0; }
    .tier-badge-0 { background: #F1F3F1; color: #6B7B72; }
    .tier-badge-1 { background: var(--al); color: var(--am); }
    .tier-badge-2 { background: var(--gl); color: var(--g); }
    .tier-badge-3 { background: #1F2937; color: #fff; }
    .tier-text { font-size: 13px; color: var(--mu); flex: 1; }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }

    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; margin-bottom: 2.5rem; }

    .sec-title { font-size: 16px; font-weight: 700; color: var(--tx); flex: 1; }
    .sec-meta { font-size: 12px; color: var(--mu); }
    .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 9px; }
    .tool-card { background: #fff; border: 1px solid var(--bd); border-radius: 12px; padding: 13px 15px; display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; transition: border-color .12s, background .12s; }

    .tool-text { flex: 1; min-width: 0; }
    .tool-name { font-size: 13.5px; font-weight: 500; color: var(--tx); line-height: 1.35; margin-bottom: 2px; }
    .tool-desc { font-size: 11.5px; color: #9DAAA2; }
    .badge { font-size: 10.5px; padding: 3px 9px; border-radius: 99px; font-weight: 500; flex-shrink: 0; white-space: nowrap; }

    .badge-locked { background: #FDF0E3; color: #C47A2E; }
    .ext { font-size: 14px; color: #C0CEC2; flex-shrink: 0; }

    /* 모달 */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 1.25rem; }
    .modal-card { background: #fff; border-radius: 16px; padding: 2rem; width: 100%; max-width: 340px; text-align: center; }
    .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .modal-sub { font-size: 13px; color: var(--mu); margin-bottom: 1.5rem; }
    .code-input { width: 100%; padding: 12px; border: 2px solid var(--bd); border-radius: 9px; font-size: 16px; font-family: inherit; text-align: center; letter-spacing: .1em; outline: none; transition: border-color .15s; font-weight: 600; }

    .l2-tab { position: fixed; right: 0; top: 42%; z-index: 300; background: var(--co); color: #fff; font-weight: 700; font-size: 13px;

    .l2-tab:hover { animation-play-state: paused; opacity: 1; }
    .l2-overlay { position: fixed; inset: 0; background: rgba(15,30,20,.45); z-index: 400; display: none; }
    .l2-overlay.show { display: block; }
    .l2-panel { position: fixed; top: 0; right: -420px; width: min(400px, 92vw); height: 100%; background: #fff; z-index: 401;
      box-shadow: -12px 0 34px rgba(0,0,0,.18); transition: right .3s ease; display: flex; flex-direction: column; }
    .l2-panel.show { right: 0; }
    .l2-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--bd); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .l2-head h3 { font-size: 16px; font-weight: 700; }
    .l2-blink { display: inline-block; background: var(--cl); color: var(--co); font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 99px; animation: blinkGlow 1.4s ease-in-out infinite; box-shadow: none; }
    .l2-body { flex: 1; overflow-y: auto; padding: 16px 20px 24px; }

    .feat-card:hover .feat-btn { background: var(--gd); }
    .feat-more { text-align: center; margin-top: 1.25rem; }
    .feat-more-btn { display: inline-block; border: 1px solid var(--g); color: var(--g); background: #fff; font-size: 13px; font-weight: 600; padding: 10px 22px; border-radius: 99px; cursor: pointer; font-family: inherit; transition: background .12s; }

    .guide-card p:last-child { margin-bottom: 0; font-weight: 700; }
    @media (max-width: 600px) { .guide-card { padding: 1.5rem 1.25rem; } }

    /* FOOTER */

    .footer-brand { font-size: 14px; font-weight: 700; color: var(--g); margin-bottom: 6px; }
    .footer-copy { font-size: 11.5px; color: var(--mu); }
    .footer-links { display: flex; justify-content: center; gap: 4px; margin-bottom: 8px; font-size: 12px; }
    .footer-links span { color: var(--mu); cursor: pointer; padding: 0 8px; }
    .footer-links span:hover { color: var(--g); }
    .footer-links a { color: var(--mu); text-decoration: none; padding: 0 8px; }

    @media (max-width: 640px) {
      .stats { gap: 1.5rem; }

      .cat-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }

    }
    @media (max-width: 420px) { .cat-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>

// ── 나이스 학교 검색 (전국) ──
const SCHOOL_API='https://smart-meal-archive.vercel.app/api/schools';
async function schoolSearch(q){
  const r=await fetch(SCHOOL_API+'?q='+encodeURIComponent(q)+'&all=1');
  if(!r.ok)throw new Error('검색 실패');
  const j=await r.json();
  return Array.isArray(j)?j:[];
}

// 기존 가입자(학교명만 저장)의 학교 코드 1회 자동 매칭
async function autoResolveSchool(){
  try{
    if(!userProfile||!userProfile.school||userProfile.schoolCode)return;
    const name=String(userProfile.school).trim();
    if(/유치원/.test(name))return; // 유치원은 나이스 미제공 → 이름만 유지
    const list=await schoolSearch(name);
    const exact=list.filter(x=>x.schoolName===name);
    const pick=exact.length===1?exact[0]:(list.length===1?list[0]:null);
    if(!pick)return;
    const patch={school:pick.schoolName,officeCode:pick.officeCode,officeName:pick.officeName,
      schoolCode:pick.schoolCode,schoolLevel:pick.level||'',schoolAddress:pick.address||''};
    await setDoc(doc(db,'users',currentUser.uid),patch,{merge:true});
    Object.assign(userProfile,patch);
    render();
  }catch(e){/* 자동 매칭 실패는 조용히 무시 */}
}

// ── 학교 선택 모달 (검색 → 교육청·주소와 함께 선택) ──
function openSchoolPicker(onPick,{title='학교 검색',allowManual=true}={}){
  const old=document.getElementById('schoolPickModal'); if(old)old.remove();
  const div=document.createElement('div');
  div.id='schoolPickModal'; div.className='modal-bg';
  div.innerHTML=`
  <div class="modal-card" style="max-width:440px;text-align:left">
    <div class="modal-title" style="text-align:center">🏫 ${esc(title)}</div>
    <div style="display:flex;gap:8px;margin:14px 0 10px">
      <input class="form-input" id="spQ" placeholder="학교명 입력 (예: 동탄중앙고)" style="flex:1">
      <button class="btn btn-g" id="spGo" style="padding:0 18px;white-space:nowrap">학교 검색</button>
    </div>
    <div id="spStatus" style="font-size:12px;color:var(--mu);margin-bottom:6px"></div>
    <div id="spList" style="max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px"></div>
    ${allowManual?`<div style="margin-top:12px;border-top:1px solid var(--border,#e2e8f0);padding-top:10px">
      <div style="font-size:12px;color:var(--mu);margin-bottom:6px">유치원 등 검색이 안 되는 기관은 이름을 직접 입력하세요.</div>
      <div style="display:flex;gap:8px">
        <input class="form-input" id="spManual" placeholder="예: 무지개유치원" style="flex:1">
        <button class="btn" id="spManualGo" style="white-space:nowrap">직접 등록</button>
      </div>
    </div>`:''}
    <button class="btn" id="spClose" style="width:100%;margin-top:12px">닫기</button>
  </div>`;
  document.body.appendChild(div);
  const q=document.getElementById('spQ'),list=document.getElementById('spList'),st=document.getElementById('spStatus');
  q.focus();
  const go=async()=>{
    const v=q.value.trim();
    if(v.length<2){st.textContent='두 글자 이상 입력해주세요.';return;}
    st.textContent='검색 중…'; list.innerHTML='';
    try{
      const rows=await schoolSearch(v);
      if(!rows.length){st.textContent='검색 결과가 없어요. 유치원 등은 아래 직접 등록을 이용하세요.';return;}
      st.textContent=rows.length+'개 학교를 찾았어요. 본인 학교를 선택하세요.';
      list.innerHTML=rows.slice(0,30).map((r,i)=>`
        <button class="sp-item" data-i="${i}" style="text-align:left;border:1px solid var(--border,#e2e8f0);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer">
          <div style="font-weight:800;font-size:14px">${esc(r.schoolName)}</div>
          <div style="font-size:12px;color:var(--mu);margin-top:3px">${esc(r.officeName||'')} · ${esc(r.address||'')}</div>
        </button>`).join('');
      [...list.querySelectorAll('.sp-item')].forEach(b=>b.onclick=()=>{div.remove();onPick(rows[+b.dataset.i]);});
    }catch(e){st.textContent='검색에 실패했어요. 잠시 후 다시 시도해주세요.';}
  };
  document.getElementById('spGo').onclick=go;
  q.onkeydown=e=>{if(e.key==='Enter')go()};
  if(allowManual){
    const m=document.getElementById('spManual');
    document.getElementById('spManualGo').onclick=()=>{
      const v=m.value.trim(); if(!v)return;
      div.remove(); onPick({schoolName:v,officeCode:'',schoolCode:'',officeName:'',level:/유치원/.test(v)?'유치원':'',address:''});
    };
    m.onkeydown=e=>{if(e.key==='Enter')document.getElementById('spManualGo').click()};
  }
  document.getElementById('spClose').onclick=()=>div.remove();
  div.onclick=e=>{if(e.target===div)div.remove()};
}

// ── 학교변경 (전근 시 연 1회) ──
async function applySchoolChange(pick){
  const now=new Date().toISOString();
  const patch={school:pick.schoolName,officeCode:pick.officeCode||'',officeName:pick.officeName||'',
    schoolCode:pick.schoolCode||'',schoolLevel:pick.level||'',schoolAddress:pick.address||'',
    prevSchool:userProfile.school||'',prevSchoolCode:userProfile.schoolCode||'',
    schoolChangedAt:now};
  await saveProfile(currentUser.uid,{...userProfile,...patch});
  Object.assign(userProfile,patch);
  alert('✅ 학교가 "'+pick.schoolName+'"(으)로 변경됐어요.\n급식소리함의 모든 도구에 함께 적용됩니다.');
  render();
}
function changeSchoolFlow(){
  const YEAR=365*24*60*60*1000, DAY=24*60*60*1000;
  const changedAt=userProfile.schoolChangedAt?new Date(userProfile.schoolChangedAt).getTime():0;
  const since=Date.now()-changedAt;
  openSchoolPicker(async pick=>{
    const key=(pick.officeCode||'')+':'+(pick.schoolCode||pick.schoolName);
    const curKey=(userProfile.officeCode||'')+':'+(userProfile.schoolCode||userProfile.school);
    if(key===curKey){alert('이미 등록된 학교예요.');return;}
    const prevKey=(userProfile.prevSchoolCode?'':'')+(userProfile.prevSchoolCode||userProfile.prevSchool||'');
    const isReturn=prevKey&&(pick.schoolCode===userProfile.prevSchoolCode||pick.schoolName===userProfile.prevSchool);
    const firstTime=!changedAt;
    const within24h=changedAt&&since<DAY;
    const overYear=changedAt&&since>=YEAR;
    if(firstTime||within24h||overYear||isReturn){
      const why=within24h?'(24시간 이내 정정)':isReturn?'(이전 학교 복귀)':'';
      if(!confirm('학교를 "'+pick.schoolName+'"(으)로 변경할까요? '+why+'\n\n학교 변경은 전근 시 연 1회만 가능합니다.'))return;
      await applySchoolChange(pick);
      return;
    }
    alert('학교 변경은 전근 시 연 1회만 가능합니다.\n추가 변경이 필요하면 개발자 김소리 선생님께 따로 문의해주세요.');
    const code=prompt('개발자에게 받은 해제 코드가 있다면 입력하세요.');
    if(code===null)return;
    if(code.trim().toUpperCase()!=='SORI-OK'){alert('해제 코드가 올바르지 않습니다.');return;}
    await applySchoolChange(pick);
  },{title:'학교변경 (전근 시 연 1회)'});
}

function renderCodeModal() {
  const existing = document.getElementById('codeModal');
  if (existing) existing.remove();
  const div = document.createElement('div');
  div.id = 'codeModal';
  div.className = 'modal-bg';
  div.innerHTML = `
  <div class="modal-card">
    <div style="font-size:28px;margin-bottom:12px;">🔑</div>
    <div class="modal-title">강의 코드 입력</div>
    <div class="modal-sub">강의에서 받은 코드를 입력하면<br>추가 도구가 열려요.</div>
    <input class="code-input" id="codeInput" placeholder="코드 입력" maxlength="20">
    <div class="code-error" id="codeError"></div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn" id="cancelCode" style="flex:1;">취소</button>
      <button class="btn btn-g" id="submitCode" style="flex:2;">확인</button>
    </div>
  </div>`;
  document.body.appendChild(div);
  const input=document.getElementById('codeInput'), errEl=document.getElementById('codeError');
  input.focus();
  document.getElementById('cancelCode').onclick=()=>div.remove();
  div.onclick=e=>{if(e.target===div)div.remove()};
  const submit=async()=>{
    const code=input.value.trim().toUpperCase();
    if(!code){errEl.textContent='코드를 입력해주세요.';return;}
    const hash=await sha256Hex(code);
    const matched=CODES.find(c=>c.h===hash);
    if(!matched){errEl.textContent='올바르지 않은 코드예요.';input.value='';return;}
    if(matched.expiresAt && new Date() > new Date(matched.expiresAt)){errEl.textContent='만료된 코드예요. 강의 담당자에게 문의해주세요.';return;}
    if(matched.tier<=( userProfile.tier||0)){errEl.textContent='이미 적용된 코드예요.';return;}
    userProfile.tier=matched.tier;
    await saveProfile(currentUser.uid,{...userProfile,tier:matched.tier});
    div.remove();
    alert(`✅ ${matched.label} 코드가 적용됐어요! 새로운 도구가 열렸어요.`);
    render();
  };
  document.getElementById('submitCode').onclick=submit;
  input.onkeydown=e=>{if(e.key==='Enter')submit()};
}

  const l2Panel=document.getElementById('l2Panel'), l2Overlay=document.getElementById('l2Overlay');
  const l2Open=()=>{l2Panel.classList.add('show');l2Overlay.classList.add('show');};
  const l2CloseFn=()=>{l2Panel.classList.remove('show');l2Overlay.classList.remove('show');};
  document.getElementById('l2Tab').onclick=l2Open;
  document.getElementById('l2Close').onclick=l2CloseFn;

  document.getElementById('ideaTab').onclick=ideaOpen;
  document.getElementById('l2IdeaBtn').onclick=()=>{l2CloseFn();ideaOpen();};
  document.getElementById('ideaCancel').onclick=ideaClose;

  document.getElementById('ideaSend').onclick=async()=>{
    const title=document.getElementById('ideaTitle').value.trim();
    const body=document.getElementById('ideaBody').value.trim();
    const st=document.getElementById('ideaStatus');
    if(!title||!body){st.style.color='var(--co)';st.textContent='앱 이름과 내용을 모두 적어주세요.';return;}
    st.style.color='var(--mu)';st.textContent='보내는 중...';

      await saveIdea({
        uid:currentUser.uid, email:currentUser.email,
        name:(userProfile&&userProfile.name)||'', school:(userProfile&&userProfile.school)||'',
        title, idea:body, status:'new', createdAt:new Date().toISOString()
      });

      document.getElementById('ideaTitle').value='';document.getElementById('ideaBody').value='';

      st.style.color='var(--co)';st.textContent='전송에 실패했어요. 잠시 후 다시 시도해 주세요.';
    }

window.scrollTo_=function(id){
  if(id===0){window.scrollTo({top:0,behavior:'smooth'});return;}
  const el=document.getElementById(id);
  if(el)window.scrollTo({top:el.offsetTop-64,behavior:'smooth'});
};

onAuthStateChanged(auth, async user=>{
  currentUser=user;
  if(user){ userProfile=await loadProfile(user.uid); }
  else { userProfile=null; view='hub'; }
  render();
  if(user&&userProfile) autoResolveSchool(); // 기존 가입자 학교코드 자동 매칭(1회)
});
