<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI를 활용한 학교급식 업무 효율화 도구 모음">
  <title>급식"소리"함</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --g: #2A8558; --gl: #E6F4EC; --gd: #1E6B44;
      --am: #C47A2E; --al: #FDF0E3;
      --bl: #2B68AC; --bll: #E6EEF8;
      --co: #C04848; --cl: #FAEAEA;
      --pu: #6B57B5; --pl: #F0EEFC;
      --te: #1A8A80; --tl: #E3F4F3;
      --bd: #E0E8E0; --tx: #1A2820; --mu: #6B7B72; --bg: #F4F7F4;
    }
    body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--tx); line-height: 1.6; }
    .hide { display: none !important; }

    /* NAV */
    .nav { background: #fff; border-bottom: 1px solid var(--bd); position: sticky; top: 0; z-index: 200; }
    .nav-in { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; height: 56px; }
    .nav-brand { font-size: 15px; font-weight: 700; color: var(--g); margin-right: 1.5rem; white-space: nowrap; cursor: pointer; }
    .nav-tabs { display: flex; flex: 1; overflow-x: auto; scrollbar-width: none; }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .nav-tab { padding: 0 12px; height: 56px; display: flex; align-items: center; font-size: 13px; color: var(--mu); white-space: nowrap; border-bottom: 2px solid transparent; cursor: pointer; transition: color .15s; }
    .nav-tab:hover { color: var(--g); }
    .nav-user { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: auto; }
    .nav-uname { font-size: 12px; color: var(--mu); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn { padding: 6px 12px; border-radius: 7px; font-size: 12px; font-weight: 500; border: 1px solid var(--bd); background: #fff; color: var(--tx); cursor: pointer; white-space: nowrap; font-family: inherit; transition: background .12s; }
    .btn:hover { background: var(--bg); }
    .btn-g { background: var(--g); color: #fff; border-color: var(--g); }
    .btn-g:hover { background: var(--gd); }
    .btn-admin { color: var(--g); border-color: var(--g); }

    /* LOGIN */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.25rem; }
    .login-card { background: #fff; border: 1px solid var(--bd); border-radius: 18px; padding: 2.25rem 1.75rem; width: 100%; max-width: 360px; text-align: center; }
    .login-logo { width: 54px; height: 54px; border-radius: 14px; background: var(--gl); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 26px; }
    .login-title { font-size: 20px; font-weight: 700; margin-bottom: 5px; }
    .login-sub { font-size: 13px; color: var(--mu); margin-bottom: 1.5rem; }
    .g-btn { width: 100%; padding: 11px; border-radius: 9px; border: 1px solid var(--bd); background: #fff; font-size: 13.5px; font-weight: 500; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer; transition: background .12s; }
    .g-btn:hover { background: var(--bg); }
    .g-btn:disabled { opacity: .5; cursor: default; }
    .login-note { font-size: 11px; color: var(--mu); margin-top: 14px; line-height: 1.7; }

    /* PROFILE SETUP */
    .form-label { display: block; font-size: 12px; font-weight: 500; color: var(--mu); margin-bottom: 5px; text-align: left; }
    .form-input { width: 100%; padding: 10px 12px; border: 1px solid var(--bd); border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; transition: border-color .15s; }
    .form-input:focus { border-color: var(--g); }
    .form-group { margin-bottom: 13px; }

    /* HERO */
    .hero { background: #fff; padding: 3rem 1.5rem 2.5rem; text-align: center; border-bottom: 1px solid var(--bd); }
    .hero-in { max-width: 680px; margin: 0 auto; }
    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--g); background: var(--gl); padding: 4px 14px; border-radius: 99px; margin-bottom: 1.25rem; }
    .hero-title { font-size: clamp(28px, 6vw, 40px); font-weight: 700; letter-spacing: -.03em; margin-bottom: 8px; }
    .hero-title em { color: var(--g); font-style: normal; }
    .hero-sub { font-size: 15px; color: var(--mu); margin-bottom: 4px; }
    .hero-by { font-size: 13px; color: var(--mu); margin-bottom: 1.75rem; }
    .stats { display: flex; justify-content: center; gap: 2.5rem; margin-bottom: 1.75rem; }
    .stat-n { font-size: 24px; font-weight: 700; color: var(--g); line-height: 1; margin-bottom: 4px; }
    .stat-l { font-size: 11px; color: var(--mu); }
    .notice { max-width: 540px; margin: 0 auto; background: #FAFDF9; border: 1px solid var(--bd); border-radius: 10px; padding: 12px 16px; font-size: 11.5px; color: var(--mu); line-height: 1.7; text-align: left; }

    /* SECTIONS */
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }
    .ey { font-size: 11px; font-weight: 600; color: var(--mu); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 1rem; }
    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; margin-bottom: 2.5rem; }
    .cat-card { background: #fff; border: 1px solid var(--bd); border-radius: 12px; padding: 1.1rem 1rem; cursor: pointer; display: block; transition: border-color .12s, transform .12s; }
    .cat-card:hover { border-color: #AACCB4; transform: translateY(-2px); }
    .cat-ico { width: 38px; height: 38px; border-radius: 9px; display: flex; align-items: center; justify-content: center; margin-bottom: 9px; font-size: 19px; }
    .cat-name { font-size: 13.5px; font-weight: 600; color: var(--tx); margin-bottom: 3px; }
    .cat-meta { font-size: 11.5px; color: var(--mu); }

    .tool-sec { padding: 0 1.5rem; margin-bottom: 2.75rem; }
    .sec-head { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 2px solid; }
    .sec-ico { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .sec-title { font-size: 16px; font-weight: 700; color: var(--tx); flex: 1; }
    .sec-meta { font-size: 12px; color: var(--mu); }
    .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 9px; }
    .tool-card { background: #fff; border: 1px solid var(--bd); border-radius: 12px; padding: 13px 15px; display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; transition: border-color .12s, background .12s; }
    .tool-card.link:hover { border-color: #AACCB4; background: #FAFDF9; }
    .tool-card.soon { opacity: .62; }
    .tool-ico { width: 37px; height: 37px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
    .tool-ico.gray { background: #F1F4F1; color: #9DAAA2; }
    .tool-text { flex: 1; min-width: 0; }
    .tool-name { font-size: 13.5px; font-weight: 500; color: var(--tx); line-height: 1.35; margin-bottom: 2px; }
    .tool-desc { font-size: 11.5px; color: #9DAAA2; }
    .badge { font-size: 10.5px; padding: 3px 9px; border-radius: 99px; font-weight: 500; flex-shrink: 0; white-space: nowrap; }
    .badge-on { background: var(--gl); color: var(--g); }
    .badge-soon { background: #F1F3F1; color: #8A9890; }
    .ext { font-size: 14px; color: #C0CEC2; flex-shrink: 0; }

    /* ABOUT */
    .about-card { background: #fff; border: 1px solid var(--bd); border-radius: 16px; padding: 2rem; display: flex; gap: 1.75rem; align-items: flex-start; }
    .about-av { width: 64px; height: 64px; border-radius: 50%; background: var(--gl); display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
    .about-name { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
    .about-role { font-size: 13px; color: var(--mu); margin-bottom: 1rem; }
    .about-list { list-style: none; }
    .about-list li { font-size: 13px; color: var(--mu); padding: 3px 0; display: flex; gap: 7px; }
    .about-list li::before { content: "·"; color: var(--g); font-weight: 700; flex-shrink: 0; }

    /* ADMIN */
    .admin-table { background: #fff; border: 1px solid var(--bd); border-radius: 12px; overflow: hidden; }
    .admin-head { display: grid; grid-template-columns: 1fr 1.2fr 1.5fr 1fr; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--bd); font-size: 12px; font-weight: 600; color: var(--mu); }
    .admin-row { display: grid; grid-template-columns: 1fr 1.2fr 1.5fr 1fr; padding: 12px 16px; border-bottom: 1px solid var(--bd); font-size: 13px; gap: 8px; align-items: center; }
    .admin-row:last-child { border-bottom: none; }

    /* FOOTER */
    .footer { background: #fff; border-top: 1px solid var(--bd); padding: 2rem 1.5rem; text-align: center; margin-top: .5rem; }
    .footer-brand { font-size: 14px; font-weight: 700; color: var(--g); margin-bottom: 6px; }
    .footer-copy { font-size: 11.5px; color: var(--mu); }

    @media (max-width: 640px) {
      .stats { gap: 1.5rem; }
      .about-card { flex-direction: column; gap: 1rem; }
      .cat-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .nav-uname { display: none; }
      .admin-head, .admin-row { grid-template-columns: 1fr 1fr; }
      .admin-head span:nth-child(n+3), .admin-row span:nth-child(n+3) { display: none; }
    }
    @media (max-width: 420px) { .cat-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>

const totalTools = CATS.reduce((s,c)=>s+c.tools.length,0);
const available  = CATS.reduce((s,c)=>s+c.tools.filter(t=>t.url).length,0);

// ── 상태 ──
let currentUser = null;
let userProfile = null;
let view = 'hub'; // 'hub' | 'admin'

const app = document.getElementById('app');
const esc = v => String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

// ── Firebase 함수 ──
async function doSignIn() {
  await signInWithPopup(auth, gprov);
}
async function doSignOut() {
  await signOut(auth);
}
async function saveProfile(uid, data) {
  await setDoc(doc(db,'users',uid), data, {merge:true});
  await setDoc(doc(db,'signups',uid), {
    name: data.name, school: data.school,
    email: data.email, joinedAt: data.joinedAt||new Date().toISOString(), uid
  }, {merge:true});
}
async function loadProfile(uid) {
  const snap = await getDoc(doc(db,'users',uid));
  return snap.exists() ? snap.data() : null;
}
async function loadSignups() {
  try {
    const q = query(collection(db,'signups'), orderBy('joinedAt','desc'));
    const snap = await getDocs(q);
    return snap.docs.map(d=>d.data());
  } catch(e) { return []; }
}

// ── 렌더 ──
function render() {
  if (!currentUser) { renderLogin(); return; }
  if (!userProfile || !userProfile.name) { renderProfile(); return; }
  if (view === 'admin' && currentUser.email === ADMIN) { renderAdmin(); return; }
  renderHub();
}

      </div>
      <button class="btn btn-g" id="saveBtn" style="width:100%;padding:12px;font-size:14px;border-radius:9px;margin-top:4px;">시작하기</button>
      <p class="login-note" style="margin-top:12px;">입력 정보는 클라우드에 저장되며 외부에 공개되지 않아요.</p>
    </div>
  </div>`;
  const schoolInput = document.getElementById('school');
  const unameInput  = document.getElementById('uname');
  const saveBtn     = document.getElementById('saveBtn');
  schoolInput.onkeydown = e => { if(e.key==='Enter') unameInput.focus(); };
  unameInput.onkeydown  = e => { if(e.key==='Enter') saveBtn.click(); };
  saveBtn.onclick = async () => {
    const school = schoolInput.value.trim();
    const name   = unameInput.value.trim();
    if (!school || !name) return;
    saveBtn.disabled = true; saveBtn.textContent = '저장 중...';
    const data = { name, school, email: currentUser.email, photoURL: currentUser.photoURL||'', joinedAt: new Date().toISOString() };
    await saveProfile(currentUser.uid, data);
    userProfile = data;
    render();
  };
}

    </div>`).join('')}

}

window.scrollTo_ = function(id) {
  if (id === 0) { window.scrollTo({top:0, behavior:'smooth'}); return; }
  const el = document.getElementById(id);
  if (el) window.scrollTo({top: el.offsetTop - 64, behavior:'smooth'});
};

// ── 인증 상태 감지 ──
onAuthStateChanged(auth, async user => {
  currentUser = user;
  if (user) {
    userProfile = await loadProfile(user.uid);
  } else {
    userProfile = null;
    view = 'hub';
  }
  render();
});
