    }

  </style>
</head>

async function saveProfile(uid, data) {
  await setDoc(doc(db,'users',uid), data, {merge:true});
  await setDoc(doc(db,'signups',uid), {
    name:data.name, school:data.school, email:data.email,
    tier:data.tier||0, joinedAt:data.joinedAt||new Date().toISOString(), uid
  }, {merge:true});
}
async function loadProfile(uid) {
  const snap = await getDoc(doc(db,'users',uid));
  return snap.exists() ? snap.data() : null;
}
async function loadSignups() {
  try {
    const q = query(collection(db,'signups'), orderBy('joinedAt','desc'));
    const snap = await getDocs(q);
    return snap.docs.map(d=>d.data());
  } catch(e) { return []; }
}

function renderCodeModal() {
  const existing = document.getElementById('codeModal');
  if (existing) existing.remove();
  const div = document.createElement('div');
  div.id = 'codeModal';
  div.className = 'modal-bg';
  div.innerHTML = `
  <div class="modal-card">
    <div style="font-size:28px;margin-bottom:12px;">🔑</div>
    <div class="modal-title">강의 코드 입력</div>
    <div class="modal-sub">강의에서 받은 코드를 입력하면<br>추가 도구가 열려요.</div>
    <input class="code-input" id="codeInput" placeholder="코드 입력" maxlength="20">
    <div class="code-error" id="codeError"></div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn" id="cancelCode" style="flex:1;">취소</button>
      <button class="btn btn-g" id="submitCode" style="flex:2;">확인</button>
    </div>
  </div>`;
  document.body.appendChild(div);
  const input=document.getElementById('codeInput'), errEl=document.getElementById('codeError');
  input.focus();
  document.getElementById('cancelCode').onclick=()=>div.remove();
  div.onclick=e=>{if(e.target===div)div.remove()};
  const submit=async()=>{
    const code=input.value.trim().toUpperCase();
    if(!code){errEl.textContent='코드를 입력해주세요.';return;}
    const matched=CODES[code];
    if(!matched){errEl.textContent='올바르지 않은 코드예요.';input.value='';return;}
    if(matched.expiresAt && new Date() > new Date(matched.expiresAt)){errEl.textContent='만료된 코드예요. 강의 담당자에게 문의해주세요.';return;}
    if(matched.tier<=( userProfile.tier||0)){errEl.textContent='이미 적용된 코드예요.';return;}
    userProfile.tier=matched.tier;
    await saveProfile(currentUser.uid,{...userProfile,tier:matched.tier});
    div.remove();
    alert(`✅ ${matched.label} 코드가 적용됐어요! 새로운 도구가 열렸어요.`);
    render();
  };
  document.getElementById('submitCode').onclick=submit;
  input.onkeydown=e=>{if(e.key==='Enter')submit()};
}

window.scrollTo_=function(id){
  if(id===0){window.scrollTo({top:0,behavior:'smooth'});return;}
  const el=document.getElementById(id);
  if(el)window.scrollTo({top:el.offsetTop-64,behavior:'smooth'});
};
